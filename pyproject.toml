[project]
name = "speech-models-on-telegram"
version = "0.1.0"
description = "Telegram voice bot that transcribes or summarizes voice notes with Gemini"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "google-genai>=3.0.0",
    "python-dotenv>=1.0.0",
    "python-telegram-bot>=22.0",
    "tenacity>=9.0.0",
]

[project.scripts]
voice-bot = "bot.bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]
